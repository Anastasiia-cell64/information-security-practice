services:
  api:
    build: .
    container_name: dean_office_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app_code
      - db_data:/app_code/data
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY не задано в .env}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?BLIND_INDEX_KEY не задано в .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
    restart: unless-stopped

volumes:
  db_data: